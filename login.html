<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assistio – Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
    <div class="container header-container">
        <a href="index.html" class="logo">Assistio</a>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="features.html">Features</a>
            <a href="pricing.html">Pricing</a>
            <a href="faq.html">FAQ</a>
            <a href="contact.html">Contact</a>
        </nav>
        <a href="contact.html" class="btn btn-primary header-cta">Book a demo</a>
    </div>
</header>

<main class="auth-page">
    <div class="container">
        <div class="auth-card">
            <h1>Log in to Assistio</h1>
            <p>Access your Assistio dashboard and manage your clients and conversations.</p>

            <form class="form" action="#" method="post" onsubmit="handleLogin(event)">
                <div class="form-row">
                    <label for="login-email">Work email</label>
                    <input id="login-email" name="email" type="email" required placeholder="you@company.com">
                </div>

                <div class="form-row">
                    <label for="login-password">Password</label>
                    <input id="login-password" name="password" type="password" required placeholder="••••••••">
                </div>

                <div class="form-row" style="flex-direction: row; align-items: center; gap: 0.4rem;">
                    <input id="login-remember" name="remember" type="checkbox" style="width:auto;">
                    <label for="login-remember" style="margin:0;">Remember me</label>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
                    Log in
                </button>

                <p style="margin-top: 0.8rem; font-size: 0.85rem; color: var(--text-muted);">
                    Don’t have an account yet?
                    <a href="signup.html">Create one</a>
                </p>
            </form>
        </div>
    </div>
</main>

<footer class="site-footer">
    <div class="container footer-container">
        <p>© Assistio 2025</p>
        <nav class="footer-nav">
            <a href="index.html">Home</a>
            <a href="features.html">Features</a>
            <a href="pricing.html">Pricing</a>
            <a href="faq.html">FAQ</a>
            <a href="contact.html">Contact</a>
            <a href="privacy.html">Privacy</a>
            <a href="terms.html">Terms</a>
        </nav>
    </div>
</footer>

<script src="scripts.js"></script>
</body>
</html>
