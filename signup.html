<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assistio – Sign up</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
    <div class="container header-container">
        <a href="index.html" class="logo">Assistio</a>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="features.html">Features</a>
            <a href="pricing.html">Pricing</a>
            <a href="faq.html">FAQ</a>
            <a href="contact.html">Contact</a>
        </nav>
        <a href="contact.html" class="btn btn-primary header-cta">Book a demo</a>
    </div>
</header>

<main class="auth-page">
    <div class="container">
        <div class="auth-card">
            <h1>Create your Assistio account</h1>
            <p>Set up your account to start managing AI assistants for your business or clients.</p>

            <form class="form" id="signup-form" data-role="signup-form" action="#" method="post" onsubmit="handleSignup(event)">
                <div class="form-row">
                    <label for="signup-name">Full name</label>
                    <input id="signup-name" name="name" type="text" required placeholder="Your name">
                </div>

                <div class="form-row">
                    <label for="signup-email">Work email</label>
                    <input id="signup-email" name="email" type="email" required placeholder="you@company.com">
                </div>

                <div class="form-row">
                    <label for="signup-company">Company</label>
                    <input id="signup-company" name="company" type="text" placeholder="Company name">
                </div>

                <div class="form-row">
                    <label for="signup-password">Password</label>
                    <input id="signup-password" name="password" type="password" required placeholder="Create a password">
                </div>

                <div class="form-row" style="flex-direction: row; align-items: flex-start; gap: 0.4rem;">
                    <input id="signup-terms" name="terms" type="checkbox" required style="width:auto; margin-top: 0.2rem;">
                    <label for="signup-terms" style="margin:0; font-size:0.85rem;">
                        I agree to the <a href="terms.html">Terms of Service</a> and have read the
                        <a href="privacy.html">Privacy Policy</a>.
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
                    Create account
                </button>

                <p style="margin-top: 0.8rem; font-size: 0.85rem; color: var(--text-muted);">
                    Already have an account?
                    <a href="login.html">Log in</a>
                </p>
            </form>
        </div>
    </div>
</main>

<footer class="site-footer">
    <div class="container footer-container">
        <p>© Assistio 2025</p>
        <nav class="footer-nav">
            <a href="index.html">Home</a>
            <a href="features.html">Features</a>
            <a href="pricing.html">Pricing</a>
            <a href="faq.html">FAQ</a>
            <a href="contact.html">Contact</a>
            <a href="privacy.html">Privacy</a>
            <a href="terms.html">Terms</a>
        </nav>
    </div>
</footer>

<script src="scripts.js"></script>
</body>
</html>
