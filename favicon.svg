<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="g" x1="40" y1="24" x2="216" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1BE7B6"/>
      <stop offset="0.55" stop-color="#2B8CFF"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="ring" x1="24" y1="24" x2="232" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1BE7B6" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#2B8CFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1BE7B6" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect x="18" y="18" width="220" height="220" rx="56" fill="#0B1220"/>
  <rect x="18" y="18" width="220" height="220" rx="56" fill="url(#g)" opacity="0.18"/>
  <rect x="18" y="18" width="220" height="220" rx="56" stroke="url(#ring)" stroke-width="4" opacity="0.7"/>

  <!-- Routing / nodes motif -->
  <path d="M70 176 C 96 152, 104 132, 122 108 C 140 84, 156 76, 186 70" stroke="rgba(255,255,255,0.45)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="70" cy="176" r="9" fill="#1BE7B6"/>
  <circle cx="122" cy="108" r="8" fill="#2B8CFF"/>
  <circle cx="186" cy="70" r="8" fill="#1BE7B6"/>

  <!-- Abstract A with integrated automation nodes -->
  <path d="M128 62 L72 190 H92 L106 160 H150 L164 190 H184 L128 62 Z" fill="rgba(255,255,255,0.92)"/>
  <path d="M116 136 L128 106 L140 136 H116 Z" fill="#0B1220" opacity="0.9"/>

  <!-- Chat bubble + spark (AI) -->
  <g filter="url(#soft)">
    <path d="M156 148 C156 132 170 120 188 120 H204 C222 120 236 132 236 148 V160 C236 176 222 188 204 188 H192 L174 202 V188 H188 C170 188 156 176 156 160 V148 Z" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.35)" stroke-width="3"/>
    <path d="M205 134 L208 145 L219 148 L208 151 L205 162 L202 151 L191 148 L202 145 L205 134 Z" fill="#1BE7B6"/>
  </g>
</svg>
